[tools]
python = "3.12"

[tasks]
# Service only — use when the MQTT broker is already running.
dev = "uv run fastapi dev app/main.py --reload-dir app"

# Full stack: MQTT broker + service (cloud_tts auto-enables when a key is set).
start = "bash scripts/start.sh"

# Broker only.
mqtt = "docker compose up mqtt -d --build"

test = "uv run pytest tests/ -q"
