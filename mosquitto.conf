# Listen and our local self-signed certs
listener 8883
cafile /mosquitto/config/keys/ca.crt
certfile /mosquitto/config/keys/mosquitto.crt
keyfile /mosquitto/config/keys/mosquitto.key
# Anyone can login, beware!
allow_anonymous true
# Log to the container's stdout (`docker compose logs mqtt`). The upstream
# OpenMoxie config logged to /mosquitto/log/mosquitto.log, but that path is a
# host bind mount the `mosquitto` user cannot write to; the failed open also
# tore down the `topic` destination below.
log_dest stdout
# Publishes the broker log to $SYS/broker/log/#, which is how the service
# detects a robot connecting or rebooting and re-pushes its config. The default
# log_type (error, warning, notice, information) already covers the "New client
# connected ... as <device id>" line; `all` would add per-subscribe chatter.
log_dest topic
